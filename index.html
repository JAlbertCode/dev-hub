<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Midnight Developer Hub · Find your path</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<style>
  :root{
    --blue:#2C2CFF; --blue-2:#8B96FF; --blue-600:#4A4AFF; --violet:#8B5CF6; --ink:#F5F6FA;
    --dim:#9EA0AE; --faint:#7C7C8A;
    --border:#22222B; --border-2:#2E2E38; --label:#13131A; --callout:rgba(44,44,255,.14); --constraint:rgba(139,92,246,.14);
    --bg:#08080B; --bg-soft:#0F0F15; --card:#0E0E14; --panel:#101018; --gold:#FFC94D; --accent:#2C2CFF;
    --shadow-sm:0 1px 0 rgba(255,255,255,.02);
    --shadow:0 1px 0 rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.55);
    --shadow-lg:0 30px 80px rgba(0,0,0,.7);
    --r:8px; --r-lg:12px;
    --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.55;letter-spacing:-.006em}
  a{color:inherit}
  svg{display:block}
  ::selection{background:rgba(44,44,255,.32)}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  .btn{cursor:pointer;border:none;font-family:inherit;color:inherit}
  :where(a,button,.btn,input):focus-visible{outline:2px solid var(--blue-2);outline-offset:2px;border-radius:4px}
  /* offset anchor jumps so the pinned header + sub-nav don't cover section headings */
  #finder,#journey,#explore,#programs{scroll-margin-top:120px}
  .backdrop{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;background:var(--bg)}

  /* Header */
  header.site{position:sticky;top:0;z-index:50;background:rgba(6,6,9,.92);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--border)}
  .hd{display:flex;align-items:center;justify-content:space-between;height:64px}
  .hd img{height:22px;display:block;filter:invert(1) brightness(1.9)}
  .hd nav{display:flex;align-items:center;gap:28px;font-size:14.5px;font-weight:500;color:var(--dim)}
  .hd .brand{display:inline-flex;align-items:center}
  .hd nav a{text-decoration:none;transition:color .15s var(--ease)}
  .hd nav a:hover{color:var(--ink)}
  .hd nav a.on{color:var(--ink);font-weight:600}
  .hd nav a.navcta{background:var(--blue);color:#fff;padding:9px 16px;border-radius:6px;font-weight:600;font-size:13px;letter-spacing:.01em;display:inline-flex;align-items:center;gap:6px}
  .hd nav a.navcta:hover{background:var(--blue-600);color:#fff}
  @media(max-width:820px){.hd nav a:not(.navcta){display:none}}
  /* Jump-to sub-nav (mirrors the live site) */
  .subnav{position:sticky;top:64px;z-index:49;border-bottom:1px solid var(--border);background:rgba(8,8,11,.82);backdrop-filter:saturate(140%) blur(12px)}
  .subnav .wrap{display:flex;align-items:center;gap:22px;height:40px;overflow-x:auto}
  .subnav .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);flex:none}
  .subnav a{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;white-space:nowrap;transition:color .15s var(--ease)}
  .subnav a:hover{color:var(--blue-2)}
  @media(max-width:600px){.subnav{display:none}}

  /* Hero */
  .hero{padding:80px 0 24px;text-align:center;position:relative}
  .hero>*{position:relative;z-index:1}
  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11.5px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-2);background:transparent;border:1px solid var(--border-2);padding:7px 15px;border-radius:100px;margin-bottom:26px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(44,44,255,.2)}
  h1.big{font-size:62px;line-height:1.02;font-weight:600;letter-spacing:-.03em;margin:0 0 20px}
  h1.big span{background:linear-gradient(96deg,#6b7bff,#a89cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .lede{font-size:19px;color:var(--dim);max-width:600px;margin:0 auto 8px;line-height:1.55}
  @media(max-width:760px){.hero{padding:52px 0 8px}h1.big{font-size:38px}.lede{font-size:16.5px}}

  /* Path finder */
  .finder{margin:44px auto 8px;max-width:920px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;text-align:left}
  .finder-head{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px}
  .step-dot{width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
  .finder-head h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
  .finder-head .sub{margin-left:auto}
  .grid-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;padding:20px 24px}
  .opt{position:relative;text-align:left;padding:14px 15px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-soft);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);display:flex;gap:13px;align-items:center}
  .opt:hover{border-color:var(--blue-2);transform:translateY(-2px)}
  .opt.sel{border-color:var(--blue-2);background:linear-gradient(180deg,var(--callout),var(--bg-soft));box-shadow:0 0 0 3px rgba(44,44,255,.18)}
  .opt .ic,.card .ic,.rc-head .ic{display:grid;place-items:center;flex:none;color:var(--blue-2);background:var(--callout);border:1px solid var(--border-2);border-radius:8px}
  .opt .ic{width:40px;height:40px}
  .opt.sel .ic{background:var(--blue);color:#fff;border-color:var(--blue-2)}
  .opt .ttl{font-weight:600;font-size:15px;margin-bottom:1px;letter-spacing:-.01em}
  .opt .ds{font-size:12.5px;color:var(--dim);line-height:1.4}
  .lnk{background:none;border:none;color:var(--dim);font-weight:600;font-size:13.5px;cursor:pointer;padding:0;font-family:inherit}
  .lnk:hover{color:var(--blue-2)}

  /* Result panel */
  .result{padding:6px 20px 24px;animation:rise .32s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .result-card{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--card)}
  .rc-head{position:relative;padding:26px 24px 22px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card));border-bottom:1px solid var(--border)}
  .rc-head:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
  .rc-head .ic{width:50px;height:50px;border-radius:10px;margin-bottom:14px;color:#fff;background:color-mix(in srgb,var(--accent) 42%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
  .rc-head h4{margin:0 0 7px;font-size:23px;font-weight:600;letter-spacing:-.02em}
  .rc-head p{margin:0;color:var(--dim);font-size:15px;max-width:640px;line-height:1.55}
  .rc-body{padding:20px 24px}
  .rc-sub{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 13px}
  @media(max-width:620px){.grid-opts{padding:16px}.rc-body,.rc-head{padding-left:18px;padding-right:18px}}

  /* Detail page: "you already know this" */
  .know{background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--border));border-radius:var(--r);padding:14px 16px;margin-bottom:20px}
  .know-lbl{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);margin-bottom:10px}
  .know-pairs{display:flex;flex-wrap:wrap;gap:8px}
  .pair{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border-2);border-radius:7px;padding:5px 11px;font-size:13px}
  .pair em{font-style:normal;color:var(--dim)}
  .pair b{font-weight:600}
  .pair svg{color:var(--accent);flex:none}

  /* Detail page: use cases */
  .dsec{margin-bottom:22px}
  .dsec:last-child{margin-bottom:0}
  .stage-head{display:flex;align-items:center;gap:9px;color:var(--ink)}
  .stage-num{width:19px;height:19px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
  .uc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:600px){.uc-grid{grid-template-columns:1fr}}
  .uc-card{display:flex;gap:10px;align-items:flex-start;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:13.5px;line-height:1.35}
  .uc-tick{width:19px;height:19px;border-radius:5px;background:color-mix(in srgb,var(--accent) 28%,transparent);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}

  /* Detail page: tooling panel */
  .toolpanel{display:flex;gap:13px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 24%,var(--border));border-radius:var(--r);padding:14px 16px;margin-bottom:22px}
  .toolpanel .tp-ic{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--border-2);color:var(--accent);display:grid;place-items:center;flex:none}
  .tp-lbl{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);margin-bottom:3px}
  .toolpanel p{margin:0;font-size:13px;color:var(--ink);line-height:1.5}

  /* Resource links */
  .links{display:grid;gap:8px}
  .rlink{display:flex;align-items:center;gap:14px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r);text-decoration:none;transition:.16s var(--ease);background:var(--bg-soft)}
  .rlink:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg-soft));transform:translateX(3px)}
  .rlink-main{min-width:0}
  .rlink .a{font-weight:600;font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
  .rlink .b{font-size:12.5px;color:var(--dim);margin-top:2px}
  .src{margin-left:6px;font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);background:var(--label);border:1px solid var(--border-2);border-radius:4px;padding:1px 6px}
  .tagpill{margin-left:6px;font-family:var(--mono);font-size:8.5px;font-weight:400;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;border:1px solid}
  .tp-com{color:#e0a852;border-color:rgba(224,168,82,.32);background:rgba(224,168,82,.1)}
  .tp-partner{color:#b79bff;border-color:rgba(139,92,246,.32);background:rgba(139,92,246,.12)}
  .rlink .arw{margin-left:auto;color:var(--faint);flex:none;transition:.16s var(--ease)}
  .rlink:hover .arw{color:var(--accent);transform:translateX(2px)}

  /* Program chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg-soft);border:1px solid var(--border);border-radius:100px;padding:7px 14px;text-decoration:none;transition:.15s var(--ease)}
  .chip svg{color:var(--accent);flex:none}
  .chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg-soft))}

  /* Sections */
  section.blk{padding:80px 0}
  .sec-h{text-align:center;margin:0 auto 8px;max-width:660px}
  .sec-h .kick{font-family:var(--mono);font-size:11.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-2)}
  .sec-h h2{font-size:38px;font-weight:600;letter-spacing:-.03em;margin:12px 0 12px}
  .sec-h p{color:var(--dim);font-size:16.5px;line-height:1.55;margin:0 auto}
  @media(max-width:760px){section.blk{padding:56px 0}.sec-h h2{font-size:28px}}

  /* Tabs */
  .tabs-wrap{text-align:center}
  .tabs{display:inline-flex;gap:4px;margin:30px 0 28px;padding:4px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px}
  .tab{padding:9px 20px;border-radius:5px;border:none;background:transparent;font-weight:600;font-size:14px;color:var(--dim);cursor:pointer;font-family:inherit;transition:.18s var(--ease)}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--blue);color:#fff}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
  .card{text-align:left;border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;background:var(--card);cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);opacity:0;transition:opacity .18s var(--ease)}
  .card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:var(--shadow)}
  .card:hover:before{opacity:1}
  .card .ic{width:44px;height:44px;border-radius:9px;margin-bottom:15px}
  .card h3{margin:0 0 7px;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .card p{margin:0;font-size:13.5px;color:var(--dim);line-height:1.5}
  .card .more{margin-top:16px;font-size:13px;font-weight:600;color:var(--blue-2);display:inline-flex;align-items:center;gap:5px;transition:gap .18s var(--ease)}
  .card:hover .more{gap:8px}

  /* Modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:44px 20px;overflow-y:auto;animation:fade .2s var(--ease)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);max-width:720px;width:100%;box-shadow:var(--shadow-lg);animation:pop .24s var(--ease);margin:auto}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .modal .x{position:absolute;top:15px;right:15px;width:34px;height:34px;border-radius:8px;background:rgba(20,20,26,.72);backdrop-filter:blur(6px);border:1px solid var(--border-2);cursor:pointer;color:var(--dim);display:grid;place-items:center;z-index:2;transition:.15s var(--ease)}
  .modal .x:hover{background:var(--bg-soft);color:var(--ink)}
  .modal-inner{position:relative}

  /* Programs strip */
  .spiral{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-lg);padding:34px 30px;margin-top:8px}
  .flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .stage{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:7px 14px}
  .flow .ar{color:var(--blue-2);display:grid;place-items:center}
  .pgroup{margin-bottom:24px}
  .pgroup:last-of-type{margin-bottom:0}
  .pgroup-h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-2);margin-bottom:12px}
  .prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .prog{display:block;text-decoration:none;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease)}
  .prog:hover{border-color:var(--accent);transform:translateY(-3px)}
  .prog .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
  .prog .nm svg{color:var(--blue-2);flex:none}
  .prog .st{font-family:var(--mono);font-size:9px;font-weight:400;text-transform:uppercase;letter-spacing:.08em;color:#3bd67e;margin-left:auto;background:rgba(59,214,126,.12);padding:3px 7px;border-radius:4px}
  .prog .st.prop{color:#b79bff;background:rgba(139,92,246,.14)}
  .prog .dc{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.45}

  /* Ship strip + footer */
  .ship{margin-top:26px;text-align:center;border-top:1px dashed var(--border-2);padding-top:26px}
  .ship-h{margin:0 0 14px;font-size:14.5px;font-weight:500;color:var(--dim);letter-spacing:-.01em}
  footer.site{border-top:1px solid var(--border);padding:52px 0 34px;margin-top:76px;color:var(--dim);font-size:14px;background:var(--bg-soft)}
  .foot-top{display:grid;grid-template-columns:1.1fr 2.4fr;gap:40px}
  @media(max-width:820px){.foot-top{grid-template-columns:1fr;gap:32px}}
  .foot-brand img{height:22px;margin-bottom:14px;display:block;filter:invert(1) brightness(1.9)}
  .foot-brand p{margin:0 0 16px;font-size:13px;color:var(--dim);line-height:1.55;max-width:280px}
  .foot-social{display:flex;gap:9px}
  .foot-social a{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);display:grid;place-items:center;color:var(--dim);background:var(--card);transition:.15s var(--ease)}
  .foot-social a:hover{color:#fff;border-color:var(--accent);background:var(--accent);transform:translateY(-1px)}
  .foot-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  @media(max-width:820px){.foot-cols{grid-template-columns:repeat(2,1fr);gap:28px 18px}}
  @media(max-width:460px){.foot-cols{grid-template-columns:1fr}}
  .foot-col{display:flex;flex-direction:column;gap:11px}
  .foot-h{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .foot-col a{font-size:13.5px;color:var(--dim);text-decoration:none;transition:.15s var(--ease)}
  .foot-col a:hover{color:var(--ink)}
  .foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:38px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--faint)}
  .foot-note{max-width:560px}

  /* Hero: left-aligned, with Ask-AI bar + X line-art (design-team layout) */
  .hero{text-align:left}
  .hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:36px;align-items:center}
  @media(max-width:880px){.hero-grid{grid-template-columns:1fr}.hero-art{display:none}}
  .hero-copy{max-width:600px}
  h1.big{margin:0 0 20px}
  .askai{margin-top:28px;display:flex;align-items:center;gap:11px;width:100%;max-width:460px;background:var(--bg-soft);border:1px solid var(--border-2);border-radius:10px;padding:14px 16px;color:var(--dim);text-decoration:none;font-size:14.5px;transition:.16s var(--ease)}
  .askai svg{color:var(--blue-2);flex:none}
  .askai .askai-key{margin-left:auto;color:var(--faint);font-family:var(--mono);font-size:13px}
  .askai:hover{border-color:var(--blue-2);color:var(--ink)}
  .hero-art{display:grid;place-items:center}
  .xart{width:100%;max-width:320px;height:auto;filter:drop-shadow(0 0 26px color-mix(in srgb,var(--accent) 45%,transparent));animation:floaty 9s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  /* Journey selector */
  .journey-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .journey-head h2{margin:0;font-size:27px;font-weight:600;letter-spacing:-.025em}
  .pills{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media(max-width:900px){.pills{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.pills{grid-template-columns:repeat(2,1fr)}}
  .pill{position:relative;text-align:left;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:16px 15px;cursor:pointer;transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease);color:var(--ink)}
  .pill:hover{border-color:var(--blue-2);transform:translateY(-2px)}
  .pill-ic{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--callout);border:1px solid var(--border-2);color:var(--blue-2);margin-bottom:12px}
  .pill-tt{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .pill-ds{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.35}
  .pill.on{border-color:transparent;background:linear-gradient(150deg,#3d3dff,#1616d6);box-shadow:0 14px 34px rgba(44,44,255,.4)}
  .pill.on .pill-ic{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
  .pill.on .pill-tt{color:#fff}
  .pill.on .pill-ds{color:rgba(255,255,255,.82)}

  /* Experience → dimension step (prominent, clearly a required choice) */
  .dims{margin-top:24px;padding:18px;border:1px solid var(--border);border-left:2px solid var(--blue);border-radius:10px;background:color-mix(in srgb,var(--blue) 5%,var(--card));animation:rise .3s var(--ease)}
  .dims-q{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:14px}
  .dims-step{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--blue);padding:3px 8px;border-radius:5px}
  .dims-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:640px){.dims-row{grid-template-columns:1fr}}
  .dim{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--border-2);background:var(--bg-soft);color:var(--ink);border-radius:9px;padding:13px 14px;cursor:pointer;transition:transform .15s var(--ease),border-color .15s var(--ease)}
  .dim:hover{border-color:var(--blue-2);transform:translateY(-2px)}
  .dim-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--callout);border:1px solid var(--border-2);color:var(--blue-2);flex:none}
  .dim-tt{display:block;font-weight:600;font-size:14px;letter-spacing:-.01em}
  .dim-ds{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;line-height:1.3}
  .dim.on{border-color:var(--blue-2);background:color-mix(in srgb,var(--blue) 16%,var(--bg-soft));box-shadow:0 0 0 2px rgba(44,44,255,.3)}
  .dim.on .dim-ic{background:var(--blue);color:#fff;border-color:var(--blue-2)}

  /* Second-level options */
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
  .opt2{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:12px 14px;cursor:pointer;transition:transform .16s var(--ease),border-color .16s var(--ease);color:var(--ink)}
  .opt2:hover{border-color:var(--blue-2);transform:translateY(-2px)}
  .opt2 .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;background:var(--callout);border:1px solid var(--border-2);color:var(--blue-2);flex:none}
  .opt2 .ttl{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .opt2.sel{border-color:var(--blue-2);background:linear-gradient(180deg,var(--callout),var(--card));box-shadow:0 0 0 3px rgba(44,44,255,.18)}
  .opt2.sel .ic{background:var(--blue);color:#fff;border-color:var(--blue-2)}
  .journey .result{padding:22px 0 0}

/* ---------------- REACTIVE BACKDROP ----------------
   A living, low-key canvas: soft color blobs + drifting motes that ease toward
   the accent of whatever path the developer is exploring. Pure canvas, no libs. */
const AccentCtx = React.createContext(() => {});
const hexToRgb = (hex) => {
  const n = parseInt(hex.replace("#",""),16);
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
};
const mix = (a,b,t) => ({r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t});
const rgba = (c,a) => `rgba(${c.r|0},${c.g|0},${c.b|0},${a})`;

function Backdrop({accent}){
  const ref = React.useRef(null);
  const target = React.useRef(hexToRgb(accent||DEFAULT_ACCENT));
  const cur = React.useRef({...target.current});
  React.useEffect(()=>{ target.current = hexToRgb(accent||DEFAULT_ACCENT); },[accent]);
  React.useEffect(()=>{
    const cv = ref.current, ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const WHITE = {r:255,g:255,b:255}, VIOLET = {r:120,g:60,b:220};
    let raf, w=1, h=1, t=0;
    const blobs = [{x:.16,y:.10,r:.46,ph:0.0,sp:.55},{x:.85,y:.22,r:.52,ph:1.9,sp:.42},{x:.52,y:.82,r:.6,ph:3.4,sp:.5}];
    const motes = Array.from({length:44},()=>({x:Math.random(),y:Math.random(),z:.3+Math.random()*.7,s:.4+Math.random()*.8}));
    const resize=()=>{ w=cv.clientWidth; h=cv.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
    resize(); window.addEventListener("resize",resize);
    const loop=()=>{
      t+=0.006;
      cur.current = {
        r:cur.current.r+(target.current.r-cur.current.r)*0.045,
        g:cur.current.g+(target.current.g-cur.current.g)*0.045,
        b:cur.current.b+(target.current.b-cur.current.b)*0.045,
      };
      const c = cur.current;
      const cols = [c, mix(c,WHITE,.5), mix(c,VIOLET,.55)];
      ctx.clearRect(0,0,w,h);
      blobs.forEach((b,i)=>{
        const bx=(b.x+Math.sin(t*b.sp+b.ph)*0.05)*w;
        const by=(b.y+Math.cos(t*b.sp*0.9+b.ph)*0.05)*h;
        const rad=b.r*Math.max(w,h), col=cols[i];
        const g=ctx.createRadialGradient(bx,by,0,bx,by,rad);
        g.addColorStop(0,rgba(col,0.20)); g.addColorStop(1,rgba(col,0));
        ctx.fillStyle=g; ctx.fillRect(bx-rad,by-rad,rad*2,rad*2);
      });
      motes.forEach(d=>{
        d.y-=0.00022*d.z; if(d.y<-0.02){ d.y=1.02; d.x=Math.random(); }
        ctx.beginPath(); ctx.fillStyle=rgba(mix(c,WHITE,.55),0.10+d.z*0.16);
        ctx.arc(d.x*w,d.y*h,d.s*d.z*1.3,0,Math.PI*2); ctx.fill();
      });
      raf=requestAnimationFrame(loop);
    };
    loop();
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener("resize",resize); };
  },[]);
  return <canvas className="backdrop" ref={ref} aria-hidden="true" />;
}

const srcLabel = (url) => {
  try {
    const h = new URL(url).hostname.replace(/^www\./,"");
    if(h.includes("github.com")) return "Repo";
    if(h.includes("docs.midnight")) return "Docs";
    if(h.includes("academy.midnight")) return "Course";
    if(h.includes("youtube")) return "Video";
    if(h.includes("zealy")) return "Quests";
    if(h.endsWith(".pdf") || url.endsWith(".pdf")) return "PDF";
    if(h.includes("vercel")) return "App";
    return "Site";
  } catch(e){ return "Site"; }
};
// who maintains it: explicit tag wins, else derive from host. Official gets no pill.
const OFFICIAL_HOSTS = ["docs.midnight.network","midnight.network","academy.midnight.network","faucet.preprod.midnight.network","preprod.midnightexplorer.com","forum.midnight.network","zealy.io","midnight.foundation","effectstream.github.io","x.com","t.me"];
const sourceTag = (l) => {
  if(l.tag) return l.tag;
  try {
    const u = new URL(l.url), h = u.hostname.replace(/^www\./,"");
    // midnightntwrk, OpenZeppelin and EffectStream (our team) count as official
    if(h==="github.com"){ const p=u.pathname.toLowerCase(); return (p.startsWith("/midnightntwrk")||p.startsWith("/openzeppelin")||p.startsWith("/effectstream"))?"official":"community"; }
    if(h.includes("youtube")||h.includes("twitter")||h.includes("discord")) return "official";
    if(OFFICIAL_HOSTS.some(o=>h===o||h.endsWith("."+o))) return "official";
    return "community";
  } catch(e){ return "community"; }
};
function ResourceLink({l}){
  const tag = sourceTag(l);
  return (
    <a className="rlink" href={l.url} target="_blank" rel="noopener noreferrer">
      <div className="rlink-main">
        <div className="a">{l.a}<span className="src">{srcLabel(l.url)}</span>{tag!=="official" && <span className={"tagpill "+(tag==="partner"?"tp-partner":"tp-com")}>{tag}</span>}</div>
        <div className="b">{l.b}</div>
      </div>
      <span className="arw"><Icon name="arrowRight" size={18} /></span>
    </a>
  );
}

function LeadChips({ids}){
  if(!ids || !ids.length) return null;
  return (
    <div className="chips">
      {ids.map(id => {
        const p = PROGRAMS[id]; if(!p) return null;
        return <a key={id} className="chip" href={p.url} target="_blank" rel="noopener noreferrer"><Icon name={p.ic} size={15} /> {p.nm}</a>;
      })}
    </div>
  );
}

/* Full detail body reused by result panel + modal */
function DetailBody({d}){
  const groups = groupByStage(d.links);
  const activeStages = STAGES.filter(s => groups[s].length);
  return (
    <div className="rc-body">
      {d.map && (
        <div className="know">
          <span className="know-lbl">You already know this</span>
          <div className="know-pairs">
            {d.map.map((m,i)=>(
              <span className="pair" key={i}><em>{m[0]}</em><Icon name="arrowRight" size={13} /><b>{m[1]}</b></span>
            ))}
          </div>
        </div>
      )}
      {d.uc && (
        <section className="dsec">
          <p className="rc-sub">{d.tools ? "What you can build" : "Where to start"}</p>
          <div className="uc-grid">
            {d.uc.map((u,i)=>(
              <div className="uc-card" key={i}><span className="uc-tick"><Icon name="check" size={13} /></span><span>{u}</span></div>
            ))}
          </div>
        </section>
      )}
      {d.tools && (
        <div className="toolpanel">
          <span className="tp-ic"><Icon name="wrench" size={18} /></span>
          <div><span className="tp-lbl">Tooling</span><p>{d.tools}</p></div>
        </div>
      )}
      {activeStages.map((st,idx)=>(
        <section className="dsec" key={st}>
          <p className="rc-sub stage-head"><span className="stage-num">{idx+1}</span>{STAGE_LABEL[st]}</p>
          <div className="links">{groups[st].map((l,i)=><ResourceLink key={i} l={l} />)}</div>
        </section>
      ))}
      {d.leads && (
        <section className="dsec">
          <p className="rc-sub">Where this leads</p>
          <LeadChips ids={d.leads} />
        </section>
      )}
    </div>
  );
}

function ResultCard({d}){
  return (
    <div className="result">
      <div className="result-card">
        <div className="rc-head">
          <div className="ic"><Icon name={d.ic} size={26} /></div>
          <h4>{d.ttl}</h4>
          <p>{d.blurb}</p>
        </div>
        <DetailBody d={d} />
      </div>
    </div>
  );
}

const DIMDATA = {ecosystem:ECOSYSTEMS, industry:INDUSTRIES, role:ROLES};
const cleanTtl = (t)=>t.replace(/^Coming from /,"").replace(" on Midnight","").replace(" / other chains","");

function PathFinder(){
  const [start,setStart] = useState(null);
  const [dim,setDim]   = useState(null);
  const [pick,setPick] = useState(null);
  const setAccent = React.useContext(AccentCtx);

  const chooseStart = (id)=>{ setPick(null); setDim(null); setStart(id===start?null:id); };
  const chooseDim   = (id)=>{ setPick(null); setDim(id); };

  // resolve result
  let result=null, options=null;
  if(start==="new") result = BEGINNER;
  else if(start==="deeper") result = DEEPER;
  else if(start==="funding") result = FUNDING;
  else if(start==="node") result = NODE;
  else if(start==="experience" && dim){
    const data = DIMDATA[dim];
    options = Object.entries(data).map(([id,v])=>({id,ic:v.ic,ttl:cleanTtl(v.ttl)}));
    if(pick) result = {...data[pick], id:pick};
  }

  const resultId = result ? result.id : null;
  useEffect(()=>{
    const a = resultId ? ACCENTS[resultId] : (start ? ACCENTS[start] : null);
    setAccent(a || (start ? DEFAULT_ACCENT : null));
  }, [resultId, start]);

  return (
    <div className="journey" id="journey">
      <div className="journey-head">
        <h2>Where are you in your journey?</h2>
        {start && <button className="lnk" onClick={()=>chooseStart(null)} style={{display:"inline-flex",alignItems:"center",gap:6}}><Icon name="refresh" size={14} /> Reset</button>}
      </div>
      <div className="pills">
        {START.map(o=>(
          <button key={o.id} className={"pill btn"+(start===o.id?" on":"")} onClick={()=>chooseStart(o.id)}>
            <span className="pill-ic"><Icon name={o.ic} size={18} /></span>
            <span className="pill-tt">{o.ttl}</span>
            <span className="pill-ds">{o.ds}</span>
          </button>
        ))}
      </div>

      {start==="experience" && (
        <div className="dims">
          <div className="dims-q"><span className="dims-step">Next</span> You've built before. Which angle fits you best?</div>
          <div className="dims-row">
            {DIMENSIONS.map(o=>(
              <button key={o.id} className={"dim btn"+(dim===o.id?" on":"")} onClick={()=>chooseDim(o.id)}>
                <span className="dim-ic"><Icon name={o.ic} size={17} /></span>
                <span className="dim-tx"><span className="dim-tt">{o.ttl}</span><span className="dim-ds">{o.ds}</span></span>
              </button>
            ))}
          </div>
        </div>
      )}

      {options && (
        <div className="opt-grid">
          {options.map(o=>(
            <button key={o.id} className={"opt2 btn"+(pick===o.id?" sel":"")} onClick={()=>setPick(o.id)}>
              <span className="ic"><Icon name={o.ic} size={20} /></span>
              <span className="ttl">{o.ttl}</span>
            </button>
          ))}
        </div>
      )}

      {result && <ResultCard d={result} />}
    </div>
  );
}

function Modal({d,onClose}){
  useEffect(()=>{
    const h=(e)=>{if(e.key==="Escape")onClose();};
    window.addEventListener("keydown",h);
    document.body.style.overflow="hidden";
    return ()=>{window.removeEventListener("keydown",h);document.body.style.overflow="";};
  },[]);
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-inner">
          <button className="x btn" onClick={onClose} aria-label="Close"><Icon name="close" size={16} /></button>
          <div className="rc-head" style={{borderRadius:"12px 12px 0 0"}}>
            <div className="ic"><Icon name={d.ic} size={26} /></div>
            <h4>{d.ttl}</h4>
            <p>{d.blurb}</p>
          </div>
          <DetailBody d={d} />
        </div>
      </div>
    </div>
  );
}

function Explore(){
  const [tab,setTab] = useState("ecosystem");
  const [open,setOpen] = useState(null);
  const setAccent = React.useContext(AccentCtx);
  const SETS = {
    ecosystem:{data:ECOSYSTEMS, sub:(v)=>v.blurb},
    industry:{data:INDUSTRIES, sub:(v)=>v.blurb},
    role:{data:ROLES, sub:(v)=>v.blurb},
  };
  const cur = SETS[tab];
  const entries = Object.entries(cur.data);
  const clean = (t)=>t.replace(/^Coming from /,"").replace(" on Midnight","");
  return (
    <div>
      <div className="tabs-wrap">
        <div className="tabs">
          {[["ecosystem","By ecosystem"],["industry","By industry"],["role","By role"]].map(([k,lbl])=>(
            <button key={k} className={"tab btn"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{lbl}</button>
          ))}
        </div>
      </div>
      <div className="cards">
        {entries.map(([id,v])=>(
          <button key={id} className="card btn" onClick={()=>{ setOpen({...v,id}); setAccent(ACCENTS[id]||DEFAULT_ACCENT); }}>
            <div className="ic"><Icon name={v.ic} size={24} /></div>
            <h3>{clean(v.ttl)}</h3>
            <p>{v.blurb.length>96?v.blurb.slice(0,94)+"…":v.blurb}</p>
            <div className="more">See tooling &amp; paths <Icon name="arrowRight" size={15} /></div>
          </button>
        ))}
      </div>
      {open && <Modal d={{...open, ttl:open.ttl}} onClose={()=>{ setOpen(null); setAccent(null); }} />}
    </div>
  );
}

function Programs(){
  const groups = [
    {h:"Learn & practice", items:[PROGRAMS.academy, PROGRAMS.zealy, PROGRAMS.devhang]},
    {h:"Funding & accelerators", items:[PROGRAMS.buildclub, PROGRAMS.nightsky,
      {nm:"Request for Startups",ic:"lightbulb",dc:"Vetted ideas to build, by vertical",url:LINKS.rfs.url}]},
    {h:"Contribute", items:[PROGRAMS.aliit,
      {nm:"Present on Fireside",ic:"flame",dc:"Apply to demo your build on the stream",url:LINKS.firesideApply.url}]},
  ];
  return (
    <div className="spiral">
      {groups.map(g=>(
        <div className="pgroup" key={g.h}>
          <div className="pgroup-h">{g.h}</div>
          <div className="prog-grid">
            {g.items.map((p,i)=>(
              <a key={i} className="prog" href={p.url} target="_blank" rel="noopener noreferrer">
                <div className="nm"><Icon name={p.ic} size={18} /> {p.nm}</div>
                <div className="dc">{p.dc}</div>
              </a>
            ))}
          </div>
        </div>
      ))}
      <div className="ship">
        <p className="ship-h">Ready to ship? Deploy to preprod and verify on-chain.</p>
        <div className="chips" style={{justifyContent:"center",marginTop:0}}>
          <a className="chip" href={LINKS.faucet.url} target="_blank" rel="noopener noreferrer"><Icon name="coins" size={15} /> Preprod faucet</a>
          <a className="chip" href={LINKS.explorer.url} target="_blank" rel="noopener noreferrer"><Icon name="blocks" size={15} /> Preprod explorer</a>
          <a className="chip" href={LINKS.networks.url} target="_blank" rel="noopener noreferrer"><Icon name="layers" size={15} /> Networks &amp; endpoints</a>
        </div>
      </div>
    </div>
  );
}

function XArt(){
  return (
    <svg className="xart" viewBox="0 0 240 210" fill="none" stroke="var(--accent)" strokeWidth="1.2" strokeLinejoin="round" aria-hidden="true">
      <rect x="40" y="35" width="96" height="96" transform="rotate(45 88 83)"/>
      <rect x="104" y="35" width="96" height="96" transform="rotate(45 152 83)"/>
      <rect x="72" y="79" width="96" height="96" transform="rotate(45 120 127)" opacity=".55"/>
      <circle cx="120" cy="105" r="3" fill="var(--accent)" stroke="none"/>
    </svg>
  );
}
